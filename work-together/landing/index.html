<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BNI Intrepid</title>
<style>html,body{margin:0;padding:0}a{-webkit-tap-highlight-color:transparent}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* One screen: a slow wall of chapter photos behind the chapter's own red. Single look, same in light and dark. */
  :root { --deep:#5E0A13; --red:#CF2030; --red-d:#A3141F; --ink:#23262D; --paper:#FFFFFF; --glass:rgba(40,6,10,.62); --line:rgba(255,255,255,.28); color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--deep); color: var(--paper); font-family: 'Inter', Arial, sans-serif; font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  .wall { position: fixed; inset: 0; display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 10px; padding-inline: 10px; overflow: hidden; z-index: 0; }
  .col { display: flex; flex-direction: column; gap: 10px; animation: rise var(--t) linear infinite; will-change: transform; }
  .col.down { animation-direction: reverse; }
  .col img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; display: block; }
  .col img:nth-child(3n) { aspect-ratio: 1; }
  @keyframes rise { from { transform: translateY(0); } to { transform: translateY(-50%); } }
  .tint { position: fixed; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(120,10,22,.5) 0%, rgba(94,10,19,.62) 45%, rgba(60,6,12,.8) 100%); }
  main { position: relative; z-index: 2; min-height: 100%; display: flex; align-items: center; justify-content: center; padding-block: 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .in { width: 100%; max-width: 440px; display: grid; gap: 18px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .brand img { height: 44px; width: auto; display: block; }
  .brand span { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .head { text-align: center; text-shadow: 0 2px 14px rgba(0,0,0,.45); }
  .head p { margin: 8px 0 0; font-size: 17px; font-weight: 600; }
  nav { display: grid; gap: 10px; }
  .tab { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; text-decoration: none; color: var(--paper); background: var(--glass); -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px); box-shadow: inset 0 0 0 1px var(--line); border-radius: 15px; padding: 13px 16px; transition: transform .08s ease, background .15s ease; }
  .tab:hover { background: rgba(40,6,10,.8); } .tab:active { transform: scale(.985); }
  .tab:focus-visible, .soc a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .tab b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -.005em; line-height: 1.2; }
  .tab small { display: block; font-size: 13.5px; font-weight: 500; opacity: .9; margin-top: 2px; }
  .tab i { font-style: normal; font-size: 20px; font-weight: 700; }
  .tab.join { background: var(--paper); color: var(--red-d); box-shadow: 0 10px 26px rgba(0,0,0,.35); padding: 17px 16px; }
  .tab.join b { font-size: 22px; } .tab.join small { color: var(--ink); }
  .soc { display: flex; justify-content: center; gap: 12px; }
  .soc a { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--paper); background: var(--glass); -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px); box-shadow: inset 0 0 0 1px var(--line); }
  .soc svg { width: 23px; height: 23px; display: block; }
  @media (prefers-reduced-motion: reduce) { .col { animation: none; } }
</style>
</head>
<body>
<div class="wall" id="wall" aria-hidden="true"></div>
<div class="tint"></div>
<main><div class="in">
  <header class="head">
    <div class="brand"><img src="bni_mark.png" alt="BNI"><span>Intrepid</span></div>
    <p>Givers Gain</p>
  </header>
  <nav aria-label="BNI Intrepid links">
    <a class="tab join" href="https://bni.co.uk/en-GB/applicationregistration?chapterId=9008" target="_blank" rel="noopener"><span><b>Join Intrepid</b><small>Your category could be open</small></span><i aria-hidden="true">→</i></a>
    <a class="tab" href="https://sub.hammer-and-pen.com/givers-trails" target="_blank" rel="noopener"><span><b>How we can work together</b><small>See how members pass work to each other</small></span><i aria-hidden="true">→</i></a>
    <a class="tab" href="https://bnisouthwales.com/en-GB/events" target="_blank" rel="noopener"><span><b>Training &amp; Events Calendar</b><small>Ongoing learning for you and your business</small></span><i aria-hidden="true">→</i></a>
    <a class="tab" href="https://sub.hammer-and-pen.com/charity-work" target="_blank" rel="noopener"><span><b>Charity Work</b><small>This week’s charity, and how to donate</small></span><i aria-hidden="true">→</i></a>
    <a class="tab" href="https://photos.app.goo.gl/2d8XV6VUuhMkJ23t5" target="_blank" rel="noopener"><span><b>Chapter photos</b><small>See BNI Intrepid in action</small></span><i aria-hidden="true">→</i></a>
  </nav>
  <div class="soc">
    <a href="https://www.instagram.com/bni_intrepid/" target="_blank" rel="noopener" aria-label="BNI Intrepid on Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.500 0 0 0 4 7.500v9A3.500 3.500 0 0 0 7.500 20h9a3.500 3.500 0 0 0 3.500-3.500v-9A3.500 3.500 0 0 0 16.500 4h-9ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.300-3.500a1.200 1.200 0 1 1 0 2.400 1.200 1.200 0 0 1 0-2.400Z"/></svg></a>
    <a href="https://www.facebook.com/IntrepidBNI/" target="_blank" rel="noopener" aria-label="BNI Intrepid on Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.500 22v-8.500h2.900l.5-3.400h-3.400V8c0-1 .3-1.700 1.700-1.700H17V3.200c-.3 0-1.400-.2-2.600-.2-2.600 0-4.400 1.600-4.400 4.500v2.600H7v3.400h3V22h3.500Z"/></svg></a>
    <a href="https://uk.linkedin.com/company/bni-intrepid-cardiff" target="_blank" rel="noopener" aria-label="BNI Intrepid on LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5.200 3.500a2 2 0 1 1 0 4 2 2 0 0 1 0-4ZM3.500 9h3.400v11.500H3.500V9Zm5.600 0h3.300v1.600h.1c.5-.9 1.600-1.900 3.300-1.900 3.500 0 4.200 2.300 4.200 5.300v6.500h-3.400v-5.800c0-1.400 0-3.100-1.900-3.100s-2.200 1.500-2.200 3v5.900H9.100V9Z"/></svg></a>
  </div>
</div></main>
<script>
(function () {
  var pics = []; for (var i = 1; i <= 18; i++) pics.push('img/p' + (i < 10 ? '0' + i : i) + '.jpg');
  var wall = document.getElementById('wall'), cols = innerWidth < 700 ? 3 : 5, per = Math.ceil(pics.length / cols);
  wall.style.setProperty('--cols', cols);
  for (var c = 0; c < cols; c++) {
    var set = []; for (var n = 0; n < Math.max(per, 6); n++) set.push(pics[(c * per + n) % pics.length]);
    var col = document.createElement('div');
    col.className = 'col' + (c % 2 ? ' down' : '');
    col.style.setProperty('--t', (46 + c * 7) + 's');
    col.innerHTML = set.concat(set).map(function (s) { return '<img src="' + s + '" alt="">'; }).join('');
    wall.appendChild(col);
  }
})();
</script>
</body>
</html>
