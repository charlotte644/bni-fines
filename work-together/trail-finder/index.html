<style>
  /* One column, one job per screen, in the chapter's own red and team colours. A single light look, as on the printed sheets. */
  :root { --red:#CF2030; --red-d:#A3141F; --deep:#8E0F1A; --ink:#23262D; --muted:#5F6470; --line:#EAE5E0; --warm:#FAF6F3; --tint:#FBF0F0; --white:#FFFFFF; --font:'Inter',Arial,sans-serif; color-scheme: light; }
  * { box-sizing: border-box; }
  body { background: var(--warm); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 620px; margin: 0 auto; }
  .demo { background: var(--ink); color: var(--white); font-size: 13px; font-weight: 600; text-align: center; padding-block: 7px; }
  .top { background: linear-gradient(125deg, var(--deep) 0%, #C41C2B 55%, #D9303F 100%); color: var(--white); padding-block: 22px 58px; }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .brand img { height: 24px; width: auto; display: block; }
  .top h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.12; }
  .top p { margin: 9px 0 0; font-size: 15.5px; max-width: 52ch; }
  main { margin-top: -40px; padding-block: 0 36px; }
  .card { background: var(--white); border-radius: 18px; padding: 20px 18px; box-shadow: 0 10px 30px rgba(90,20,25,.12); }
  .meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 700; color: var(--red-d); }
  .meta span:last-child { color: var(--muted); font-weight: 600; }
  .bar { height: 7px; background: #F1ECE7; border-radius: 7px; overflow: hidden; margin: 8px 0 18px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--deep), var(--red)); border-radius: 7px; }
  .card h2 { font-size: 23px; font-weight: 800; line-height: 1.22; letter-spacing: -.012em; }
  .eg { margin: 6px 0 0; font-size: 14.5px; color: var(--muted); }
  .fds { display: grid; gap: 10px; margin-top: 14px; }
  .fd span { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
  .fd input { width: 100%; font-size: 16px; color: var(--ink); background: #F7F3EF; border: 1.5px solid transparent; border-radius: 11px; padding: 11px 13px; }
  .fd input:focus { outline: none; border-color: var(--red); background: var(--white); }
  .ok { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 14.5px; font-weight: 600; }
  .ok input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--red); flex: none; }
  .er { margin: 10px 0 0; color: var(--red-d); font-size: 14px; font-weight: 700; }
  .go { display: block; width: 100%; margin-top: 14px; border: 0; border-radius: 13px; padding: 15px; font-size: 18px; font-weight: 800; background: var(--red); color: var(--white); }
  .go:hover { background: var(--red-d); }
  .events { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 16px; }
  .ev { border: 0; text-align: left; background: #F7F3EF; color: var(--ink); border-radius: 13px; padding: 14px; font-size: 15.5px; font-weight: 700; line-height: 1.25; }
  .ev small { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-top: 3px; }
  .ev:hover { background: var(--tint); color: var(--red-d); }
  .grp { grid-column: 1 / -1; margin: 6px 0 -2px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .yn button { border: 0; border-radius: 13px; padding: 16px; font-size: 18px; font-weight: 800; }
  .yes { background: var(--red); color: var(--white); } .yes:hover { background: var(--red-d); }
  .no { background: #F4F0EC; color: var(--ink); } .no:hover { background: #EBE5DF; }
  .txt { background: none; border: 0; padding: 4px 0; margin-top: 12px; color: var(--red-d); font-weight: 600; font-size: 14.5px; text-decoration: underline; text-underline-offset: 3px; }
  .res { display: grid; gap: 14px; }
  .lead { font-size: 15px; margin: 6px 0 0; color: var(--muted); }
  .chain { position: relative; display: grid; gap: 10px; margin-top: 16px; }
  .chain::before { content: ""; position: absolute; left: 13px; top: 18px; bottom: 26px; width: 2px; background: #E3DBD3; }
  .st { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
  .no-n { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; background: var(--c); color: var(--white); font-size: 13.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px var(--white); }
  .box { min-width: 0; background: var(--warm); border-radius: 13px; padding: 11px 13px; }
  .box b.does { display: block; font-size: 15.5px; font-weight: 800; line-height: 1.25; }
  .who { margin-top: 3px; font-size: 14.5px; } .who em { font-style: normal; color: var(--muted); }
  .tier { margin-top: 5px; font-size: 13px; color: var(--muted); }
  .send { background: linear-gradient(125deg, var(--deep) 0%, #C41C2B 60%, #D9303F 100%); color: var(--white); }
  .send h3 { font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
  .send p { margin: 6px 0 0; font-size: 14.5px; }
  .send p.sm { font-size: 13px; opacity: .92; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
  .slots button { border: 0; border-radius: 12px; padding: 13px 8px; background: var(--white); color: var(--red-d); font-size: 15px; font-weight: 800; }
  .next { margin: 12px 0 0; padding: 0 0 0 20px; display: grid; gap: 8px; font-size: 15px; } .next li::marker { color: var(--red-d); font-weight: 800; } .next b { font-weight: 800; }
  .foot { margin: 16px 2px 0; font-size: 13px; color: var(--muted); }
  @media (max-width: 400px) { .top h1 { font-size: 26px; } .card h2 { font-size: 21px; } }
</style>

  ['clive','Write or update your Will','Do you already have an up-to-date Will?',true],
  ['chrisa','Review your mortgage','Do you still have a mortgage?',false] ] },
 { g:'Life', n:'A leak at a rental home', s:'Fixed fast', steps:[
  ['michelle','Take the tenant’s call','Would you like an agent to deal with tenants for you?',false],
  ['alex','Fix the leak'],
  ['anthony','Check and clear the drains','Is water backing up from the drains?',false],
  ['trae','Make the electrics safe','Has water reached any electrics?',false],
  ['westen','Check what the cover includes','Will you need to claim on insurance?',false] ] },
 { g:'Life', n:'Inheriting a house', s:'Next steps for the family', steps:[
  ['clive','Handle probate and the legal side'],
  ['charlotte','Keep track of the paperwork and deadlines','Would you like help keeping track of the paperwork and deadlines?',false],
  ['sue','Value or sell the property','Are you thinking of selling?',false],
  ['stuartb','Plan the next steps for the money','Would you like advice on the money?',false],
  ['michelle','Let it, if the family keep it','Are you thinking of letting it out?',false],
  ['seamus','Move the bills over','Do the household bills need moving into a new name?',false] ] },
 { g:'Life', n:'A tenant moves out', s:'Ready for the next one', steps:[
  ['michelle','Find new tenants','Do you already have new tenants lined up?',true],
  ['alex','Carry out the gas safety check','Is the gas safety certificate due?',false],
  ['trae','Check the electrics','Is the electrical safety check (EICR) due?',false],
  ['philip','Test the alarms','Do the alarms need testing or replacing?',false],
  ['seamus','Sort the bills between tenants'] ] },
 { g:'Life', n:'Making your home safer and cheaper to run', s:'Lower bills, more peace of mind', steps:[
  ['seamus','Review your household bills'],
  ['adam','Upgrade the windows and doors','Are your windows or doors draughty?',false],
  ['philip','Add an alarm and CCTV','Would you like an alarm or CCTV?',false],
  ['trae','Fit an EV charger or solar electrics','Would you like an EV charger or solar panels?',false],
  ['anthony','Protect your home from flooding','Is your home at risk of flooding?',false] ] }
];
var me = null, ev = null, qs = [], ans = [], slot = null, err = '', coord = null;
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function trail() { return ev.steps.filter(function (s, i) { var q = qs.indexOf(i); return s[2] === undefined || ans[q] !== s[3]; }); }
function bar(n, total) { return '<div class="bar"><i style="width:' + Math.round(n / total * 100) + '%"></i></div>'; }
function details() {
  return '<form class="card" id="f" novalidate><div class="meta"><span>Your details</span><span>Example details filled in</span></div>' + bar(1, 8) + '<h2>Let’s start with you</h2><div class="fds">' +
    '<label class="fd"><span>Your name</span><input id="n" type="text" autocomplete="name" value="Sam Example"></label>' +
    '<label class="fd"><span>Email</span><input id="e" type="email" autocomplete="email" value="sam@example.com"></label>' +
    '<label class="fd"><span>Phone number</span><input id="p" type="tel" autocomplete="tel" value="07000 000000"></label></div>' +
    '<label class="ok"><input id="c" type="checkbox" checked><span>I’m happy for Hammer and Pen to call me, and to share my details with the members I meet on a group call.</span></label>' +
    (err ? '<p class="er" role="alert">' + esc(err) + '</p>' : '') + '<button class="go" type="submit">Continue</button></form>';
}
function events() {
  var h = '', g = '';
  EV.forEach(function (x, i) { if (x.g !== g) { g = x.g; h += '<div class="grp">' + (g === 'Life' ? 'In your life' : 'In your business') + '</div>'; } h += '<button class="ev" type="button" data-e="' + i + '">' + esc(x.n) + '<small>' + esc(x.s) + '</small></button>'; });
  return '<div class="card"><div class="meta"><span>What’s happening?</span><span>Hi ' + esc(me.n.split(' ')[0]) + '</span></div>' + bar(2, 8) + '<h2>What’s happening in your life or business?</h2><div class="events">' + h + '</div></div>';
}
function needCoord() { return trail().filter(function (s) { return s[0] !== 'charlotte'; }).length >= 3; }
function coordQ() {
  var n = trail().filter(function (s) { return s[0] !== 'charlotte'; }).length;
  return '<div class="card"><div class="meta"><span>One last question</span><span>' + esc(ev.n) + '</span></div>' + bar(qs.length + 3, qs.length + 4) + '<h2>Your trail has ' + n + ' people on it. Would you like one point of contact who keeps everyone on track for you?</h2><div class="yn"><button class="yes" type="button" data-c="1">Yes</button><button class="no" type="button" data-c="0">No</button></div><button class="txt" type="button" id="back">Go back</button></div>';
}
function question() {
  var n = ans.length, q = ev.steps[qs[n]];
  return '<div class="card"><div class="meta"><span>Question ' + (n + 1) + ' of ' + qs.length + '</span><span>' + esc(ev.n) + '</span></div>' + bar(n + 3, qs.length + 3) + '<h2>' + esc(q[2]) + '</h2><div class="yn"><button class="yes" type="button" data-a="1">Yes</button><button class="no" type="button" data-a="0">No</button></div><button class="txt" type="button" id="back">Go back</button></div>';
}
var SLOTS = ['Mon 9 Nov, 16:15', 'Tue 10 Nov, 11:15', 'Thu 12 Nov, 14:15', 'Thu 12 Nov, 16:15', 'Mon 16 Nov, 14:45', 'Tue 17 Nov, 10:00'];
function result() {
  var t = trail();
  if (coord) { var had = t.filter(function (s) { return s[0] === 'charlotte'; })[0], c = ['charlotte', 'Be your one point of contact throughout']; c.also = had ? had[1] : ''; t = [c].concat(t.filter(function (s) { return s[0] !== 'charlotte'; })); }
  var steps = t.map(function (s, i) { var p = P[s[0]]; return '<div class="st" style="--c:' + TC[p[4]] + '"><div class="no-n">' + (i + 1) + '</div><div class="box"><b class="does">' + esc(s[1]) + '</b><div class="who">' + esc(p[0]) + ' <em>' + esc(p[1]) + '</em></div>' + (s.also ? '<div class="tier">Also: ' + esc(s.also.charAt(0).toLowerCase() + s.also.slice(1)) + '</div>' : '') + '</div></div>'; }).join('');
  var first = esc(me.n.split(' ')[0]);
  if (!t.length) return '<div class="res"><section class="card"><h2>It sounds like you’re already sorted</h2><p class="lead">Go back if you’d like to change an answer, or start again for something else.</p></section><button class="txt" type="button" id="again">Start again</button></div>';
  var book = slot === null
    ? '<section class="card send"><h3>Book your call with Hammer and Pen</h3><p>A quick call to check what you need. Then we’ll bring your team together on one Google Meet.</p><div class="slots">' + SLOTS.map(function (s, i) { return '<button type="button" data-t="' + i + '">' + esc(s) + '</button>'; }).join('') + '</div><p class="sm">Free times as of 7 November. The live page would always show current times.</p></section>'
    : '<section class="card send"><h3>You’re booked in, ' + first + '</h3><p>Hammer and Pen will call you on ' + esc(SLOTS[slot]) + '. In the live version you’d get a confirmation email. Nothing was booked in this demo.</p></section>';
  return '<div class="res"><section class="card"><h2>' + first + '’s trail: ' + esc(ev.n.toLowerCase()) + '</h2><p class="lead">' + t.length + (t.length === 1 ? ' step' : ' steps') + ', in the order you’ll need them.</p><div class="chain">' + steps + '</div></section>' + book +
    '<section class="card"><h2>What happens next</h2><ol class="next"><li><b>We speak.</b> Hammer and Pen calls you to understand what you need and who you need first.</li><li><b>We bring your team together.</b> We arrange one 30-minute Google Meet at a time that suits you.</li><li><b>You meet them all at once.</b> Each member explains how they’d help, and you ask your questions.</li><li><b>You get a clear plan.</b> We email you who’s doing what next.</li></ol></section>' +
    '<button class="txt" type="button" id="again">Start again</button><p class="foot">These are examples of what members offer. Ask each member exactly what they do.</p></div>';
}
function draw() {
  var a = document.getElementById('app');
  a.innerHTML = !me ? details() : !ev ? events() : ans.length < qs.length ? question() : (coord === null && needCoord()) ? coordQ() : result();
}
function toTop() { window.scrollTo(0, 0); }
document.addEventListener('submit', function (e) {
  e.preventDefault();
  var v = function (i) { return document.getElementById(i).value.trim(); }, d = { n: v('n'), e: v('e'), p: v('p') };
  if (!d.n || !/^\S+@\S+\.\S+$/.test(d.e)) { err = 'Please add your name and a valid email.'; draw(); return; }
  if (!document.getElementById('c').checked) { err = 'Please tick the box so Hammer and Pen can call you.'; draw(); return; }
  err = ''; me = d; draw(); toTop();
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.e) { ev = EV[+b.dataset.e]; qs = []; ev.steps.forEach(function (s, i) { if (s[2]) qs.push(i); }); ans = []; slot = null; coord = null; draw(); toTop(); return; }
  if (b.dataset.a) { ans.push(b.dataset.a === '1'); draw(); toTop(); return; }
  if (b.dataset.c) { coord = b.dataset.c === '1'; draw(); toTop(); return; }
  if (b.dataset.t) { slot = +b.dataset.t; draw(); return; }
  if (b.id === 'back') { if (ans.length) ans.pop(); else ev = null; draw(); return; }
  if (b.id === 'again') { ev = null; ans = []; slot = null; coord = null; draw(); toTop(); }
});
draw();
</script>
